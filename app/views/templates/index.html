{{ define "content" }}
UserName:{{.Name}}
<h1>Sample TodoApp</h1>
<hr>
<p>[<a href="/todos/new">Create</a>]</p>

{{ range .Todos }}
<div>{{ .Content }}</div>
<p>[<a href="/todos/{{.ID}}">Edit</a>]</p>
<form action="/todos/{{.ID}}" method="post" style="display:inline;">
    <input type="hidden" name="_method" value="DELETE">
    <button type="submit" style="background:none;border:none;color:blue;text-decoration:underline;cursor:pointer;">[Delete]</button>
</form>
<hr>
{{end}}
{{end}}
